<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Student Hub</title>

    <link rel="stylesheet" href="class.css">

    <style>

        body{
            background:linear-gradient(135deg,#0f4c81,#4fa3d1);
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }

        .container{

            width:500px;
            max-width:90%;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);

        }

        h1{

            color:#0f4c81;
            text-align:center;
            margin-bottom:20px;

        }

        p{

            text-align:center;
            line-height:1.7;
            margin-bottom:25px;

        }

        h3{

            color:#0f4c81;
            margin-bottom:20px;

        }

        label{

            display:block;
            margin-bottom:8px;
            font-weight:bold;

        }

        input[type="text"],
        input[type="email"],
        textarea{

            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:20px;
            font-size:15px;
            box-sizing:border-box;
            transition:.3s;

        }

        input:focus,
        textarea:focus{

            outline:none;
            border-color:#0f4c81;
            box-shadow:0 0 8px rgba(15,76,129,.25);

        }

        textarea{

            resize:vertical;

        }

        input[type="submit"]{

            width:100%;
            padding:12px;
            background:#0f4c81;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:.3s;

        }

        input[type="submit"]:hover{

            background:#1565c0;

        }

        .back{

            text-align:center;
            margin-top:25px;

        }

        .back a{

            text-decoration:none;
            color:#0f4c81;
            font-weight:bold;

        }

        .back a:hover{

            text-decoration:underline;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>About Us</h1>

    <p>
        <b>
            This website is designed to provide a simple interface for managing
            assignments and settings.
        </b>
    </p>

    <h3>Contact Us</h3>

    <form action="contact_us.php" method="post">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>

        <textarea id="message" name="message" rows="5" required></textarea>

        <input type="submit" value="Submit">

    </form>

    <div class="back">

        <a href="index.html">← Back to Login</a>

    </div>

</div>

</body>
</html>
