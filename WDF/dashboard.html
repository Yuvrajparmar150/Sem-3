<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Hub</title>

    <link rel="stylesheet" href="class.css">

    <style>
        body{
            display:block;
            background:#eef3f8;
        }

        .navbar{
            background:#0f4c81;
            padding:18px;
            text-align:center;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }

        .navbar a{
            margin:8px;
        }

        .dashboard{
            width:90%;
            max-width:1000px;
            margin:40px auto;
        }

        .welcome{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
            text-align:center;
            margin-bottom:30px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,.1);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .card h3{
            color:#0f4c81;
            margin-bottom:20px;
        }
    </style>

</head>

<body>

<div class="navbar">

<a href="dashboard.html">Dashboard</a>

<a href="profile.html">Profile</a>

<a href="attendance.html">Attendance</a>

<a href="assignments.html">Assignments</a>

<a href="results.html">Results</a>

<a href="timetable.html">Timetable</a>

<a href="settings.html">Settings</a>

<a href="about.html">About</a>

</div>

<div class="dashboard">

<div class="welcome">

<h1>Welcome Student</h1>

<p>
Manage your academic information from one place.
</p>

</div>

<div class="cards">

<div class="card">

<h3>Profile</h3>

<a href="profile.html">Open</a>

</div>

<div class="card">

<h3>Attendance</h3>

<a href="attendance.html">View</a>

</div>

<div class="card">

<h3>Assignments</h3>

<a href="assignments.html">View</a>

</div>

<div class="card">

<h3>Results</h3>

<a href="results.html">View</a>

</div>

<div class="card">

<h3>Timetable</h3>

<a href="timetable.html">View</a>

</div>

<div class="card">

<h3>Settings</h3>

<a href="settings.html">Open</a>

</div>

</div>

<br><br>

<div style="text-align:center;">
<a href="index.html">Logout</a>
</div>

</div>

</body>
</html>
